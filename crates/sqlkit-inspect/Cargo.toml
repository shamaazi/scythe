[package]
name = "sqlkit-inspect"
version = "0.20.3"
edition = "2024"
license = "MIT"
description = "Live-database health-check engine for sqlkit"
repository = "https://github.com/shamaazi/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "postgres", "lint", "audit", "database"]
categories = ["development-tools", "database"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

[features]
default = ["postgres"]
# `postgres` pulls in the PostgreSQL client: the live checks, schema drift and
# query verification. Without it only the database-free parts compile.
live-tests = []
postgres = ["dep:tokio", "dep:tokio-postgres", "dep:tracing"]

[dependencies]
regex = "1"
sqlkit-core = { path = "../sqlkit-core", version = "0.20.3" }
sqlkit-lint = { path = "../sqlkit-lint", version = "0.20.3" }
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
toml = "1.1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
