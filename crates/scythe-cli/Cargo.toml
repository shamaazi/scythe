[package]
name = "scythe-cli"
version = "0.20.3"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "CLI for scythe -- SQL-to-code generator with linting and formatting"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "codegen", "cli", "database", "sqlc"]
categories = ["command-line-utilities", "database"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

# ~keep cargo-binstall support: the release archives are named `scythe-{target}`
# ~keep (ProjectName, not the `scythe-cli` crate name) and ship tar.gz on unix but a
# ~keep .zip on windows,
# ~keep so pin the URL and bin-dir explicitly and let `{ archive-suffix }` pick the right
# ~keep extension per target. Binary sits at the archive root.
# ~keep See https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/scythe-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "scythe"
path = "src/main.rs"

[features]
# Every database engine and every target language. Building with
# `--no-default-features` and naming only the engines and languages a project
# uses skips the rest, including the bundled DuckDB and SQLite C/C++ builds,
# e.g. `--no-default-features --features postgres,lang-typescript`.
# Configuring an engine or backend left out of the build is a runtime error
# naming the feature to enable.
default = ["all-engines", "all-languages"]
all-engines = ["duckdb", "mssql", "mysql", "oracle", "postgres", "redshift", "snowflake", "sqlite"]
all-languages = ["lang-rust", "lang-typescript"]
# Engines. Features that include a driver also enable `scythe inspect`,
# `schema_source = "execute"` or `scythe check --database-url` for that engine.
duckdb = ["scythe-codegen/duckdb", "scythe-inspect/duckdb"]
mssql = ["scythe-codegen/mssql"]
mysql = ["scythe-codegen/mysql", "scythe-inspect/mysql"]
oracle = ["scythe-codegen/oracle"]
postgres = ["dep:tokio-postgres", "scythe-codegen/postgres", "scythe-inspect/postgres"]
redshift = ["scythe-codegen/redshift"]
snowflake = ["scythe-codegen/snowflake"]
sqlite = ["scythe-codegen/sqlite", "scythe-inspect/sqlite"]
# Target languages. `lang-typescript` includes the JavaScript variants.
lang-rust = ["scythe-codegen/lang-rust"]
lang-typescript = ["scythe-codegen/lang-typescript"]
# Gates the live-PostgreSQL integration tests in `tests/lint_live.rs` and
# `tests/check_mixed_engine_integration.rs` -- see #162. Without this feature
# those tests do not exist as far as `cargo test` is concerned (the files
# start with `#![cfg(feature = "live-tests")]`), which is different from, and
# safer than, the env-var-only skip they used before: that skip printed `ok`
# regardless of whether a database was ever reachable, and no CI job set the
# env var it checked, so all four ran zero times while reporting success in
# every run. Matches `scythe-inspect` and `scythe-conformance`'s own
# `live-tests` feature.
live-tests = []

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
regex = "1"
scythe-backend = { path = "../scythe-backend", version = "0.20.3" }
scythe-codegen = { path = "../scythe-codegen", version = "0.20.3", default-features = false }
scythe-core = { path = "../scythe-core", version = "0.20.3" }
scythe-inspect = { path = "../scythe-inspect", version = "0.20.3", default-features = false }
scythe-lint = { path = "../scythe-lint", version = "0.20.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlparser = "0.63"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = { version = "0.7", optional = true }
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
syn = { version = "3", features = ["full", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
