[package]
name = "scythe-inspect"
version = "0.20.2"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "Live-database health-check engine for scythe"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "postgres", "lint", "audit", "database"]
categories = ["development-tools", "database"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

[features]
default = ["duckdb", "mysql", "postgres", "sqlite"]
# One feature per database engine driver. Each pulls in that engine's native
# client crate (DuckDB and SQLite compile their bundled C/C++ sources), so a
# build that needs only some engines can disable the rest with
# `default-features = false`. A disabled engine is still recognised by name:
# requesting it fails with `InspectError::EngineDisabled`, which names the
# feature to enable.
duckdb = ["dep:duckdb"]
live-tests = []
mysql = ["dep:mysql_async"]
postgres = ["dep:tokio", "dep:tokio-postgres", "dep:tracing"]
sqlite = ["dep:rusqlite"]

[dependencies]
async-trait = "0.1"
duckdb = { version = "1.20000", features = ["bundled"], optional = true }
mysql_async = { version = "0.37", optional = true }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
scythe-core = { path = "../scythe-core", version = "0.20.2" }
scythe-lint = { path = "../scythe-lint", version = "0.20.2" }
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
toml = "1.1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
