name: CI

# Every job runs a devenv task, so CI and a local `devenv tasks run <task>` do the same thing.
on:
  push:
    branches: [shamaazi]
  pull_request:
    branches: [shamaazi]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task:
          - sqlkit:lint
          - sqlkit:test
          - sqlkit:generated-fresh
          - sqlkit:integration
          - sqlkit:cluster-scope
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.task }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.task }}-
      - name: Run ${{ matrix.task }}
        run: devenv tasks run --show-output ${{ matrix.task }}
