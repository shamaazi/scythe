[workspace]
resolver = "3"
members = [
    "crates/sqlkit-backend",
    "crates/sqlkit-cli",
    "crates/sqlkit-codegen",
    "crates/sqlkit-conformance",
    "crates/sqlkit-core",
    "crates/sqlkit-inspect",
    "crates/sqlkit-lint",
    "tools/integration-test-generator",
    "tools/test-generator",
]

[profile.release]
# Strip symbols from the installed CLI; nobody who runs it needs them.
strip = "symbols"
